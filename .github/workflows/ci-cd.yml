# 코드 변경 → 테스트 → 이미지 빌드 → Lightsail 배포(실패 시 자동 롤백)
#
# 필요한 설정 (저장소 Settings → Secrets and variables → Actions)
#   Secrets:   LIGHTSAIL_HOST     서버 고정 IP 또는 도메인
#              LIGHTSAIL_USER     SSH 사용자 (Amazon Linux는 ec2-user, Ubuntu는 ubuntu)
#              LIGHTSAIL_SSH_KEY  SSH 개인키 (.pem 내용)
#   Variables: DEPLOY_ENABLED     'true'로 두면 main 병합 시 배포 (없으면 테스트·빌드까지만)
#              DOW_DOMAIN         (선택) 도메인. 있으면 서버에 Caddy를 띄워 HTTPS로 서비스
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: 단위·통합 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  ml:
    name: ML 파이프라인 테스트 (게이트·레지스트리·parity)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r ml/requirements.txt
      - run: python -m pytest -q ml/tests

  e2e:
    name: 브라우저 e2e
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright -r ml/requirements.txt   # e2e가 게이지 확인용 모델을 먼저 학습함
      - run: python -m playwright install --with-deps chromium
      - run: python tests/e2e/run_e2e.py
      - name: 스크린샷 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/e2e/shots/
          retention-days: 7

  build:
    name: Docker 이미지 빌드·푸시
    needs: [test, ml, e2e]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Lightsail 배포
    needs: build
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: SSH 준비
        env:
          KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_lightsail
          chmod 600 ~/.ssh/id_lightsail
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
      - name: 배포 스크립트 갱신
        run: scp -i ~/.ssh/id_lightsail deploy/deploy.sh deploy/rollback.sh "${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}:/opt/dow/"
      - name: 배포 (헬스체크 실패 시 서버에서 자동 롤백)
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          DOMAIN: ${{ vars.DOW_DOMAIN }}
        run: |
          ssh -i ~/.ssh/id_lightsail "${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}" \
            "echo '$TOKEN' | docker login ghcr.io -u '$ACTOR' --password-stdin >/dev/null && \
             chmod +x /opt/dow/*.sh && DOW_DOMAIN='$DOMAIN' /opt/dow/deploy.sh '$IMAGE' '${{ github.sha }}'; rc=\$?; docker logout ghcr.io >/dev/null; exit \$rc"
      - name: 외부에서 버전 확인
        env:
          URL: ${{ vars.DOW_DOMAIN && format('https://{0}', vars.DOW_DOMAIN) || format('http://{0}', secrets.LIGHTSAIL_HOST) }}
        run: |
          for i in $(seq 1 20); do   # 첫 HTTPS 배포는 인증서 발급에 몇 초~수십 초 걸린다
            body=$(curl -fsS --max-time 5 "$URL/healthz" || true)
            echo "$body"
            if echo "$body" | grep -q '"version":"${{ github.sha }}"'; then exit 0; fi
            sleep 3
          done
          echo "외부에서 새 버전이 확인되지 않음" >&2; exit 1
